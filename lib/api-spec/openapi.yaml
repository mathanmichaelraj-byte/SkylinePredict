openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PropertyIntel Real Estate Intelligence API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: properties
    description: Property listing operations
  - name: areas
    description: Area analytics and heatmap data
  - name: news
    description: News sentiment for areas
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List all properties with filters
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [plot, flat, house, villa]
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: valueLabel
          in: query
          schema:
            type: string
            enum: [green, red, blue]
        - name: verifiedOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"

  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a single property by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Property details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /areas:
    get:
      operationId: listAreas
      tags: [areas]
      summary: List area heatmap data
      parameters:
        - name: city
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Area analytics list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"

  /news:
    get:
      operationId: listNews
      tags: [news]
      summary: Get recent news articles with sentiment
      parameters:
        - name: area
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: News articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsArticle"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Property:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        address:
          type: string
        area:
          type: string
        city:
          type: string
        lat:
          type: number
        lng:
          type: number
        type:
          type: string
          enum: [plot, flat, house, villa]
        areaSqft:
          type: number
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        askingPrice:
          type: number
        fairPriceMin:
          type: number
        fairPriceMax:
          type: number
        pricePerSqft:
          type: number
        valueLabel:
          type: string
          enum: [green, red, blue]
        valueScore:
          type: number
        futureOutlook:
          type: string
          enum: [low, medium, high]
        connectivityScore:
          type: number
        verificationStatus:
          type: string
          enum: [unverified, partial, verified]
        yearBuilt:
          type: integer
        description:
          type: string
        imageUrl:
          type: string
      required:
        - id
        - title
        - address
        - area
        - city
        - lat
        - lng
        - type
        - areaSqft
        - askingPrice
        - fairPriceMin
        - fairPriceMax
        - pricePerSqft
        - valueLabel
        - valueScore
        - futureOutlook
        - connectivityScore
        - verificationStatus
        - description

    PropertyDetail:
      allOf:
        - $ref: "#/components/schemas/Property"
        - type: object
          properties:
            landmarks:
              type: array
              items:
                $ref: "#/components/schemas/Landmark"
            newsSentiment:
              type: string
              enum: [positive, neutral, negative]
            newsHeadlines:
              type: array
              items:
                type: string
            investmentFactors:
              type: array
              items:
                type: string
            riskFactors:
              type: array
              items:
                type: string
            priceHistory:
              type: array
              items:
                $ref: "#/components/schemas/PricePoint"
          required:
            - landmarks
            - newsSentiment
            - newsHeadlines
            - investmentFactors
            - riskFactors
            - priceHistory

    Landmark:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [metro, school, hospital, it_park, mall, bus_stop, highway]
        distanceKm:
          type: number
      required:
        - name
        - type
        - distanceKm

    PricePoint:
      type: object
      properties:
        month:
          type: string
        pricePerSqft:
          type: number
      required:
        - month
        - pricePerSqft

    Area:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        lat:
          type: number
        lng:
          type: number
        avgPricePerSqft:
          type: number
        valueScore:
          type: number
        futureScore:
          type: number
        sentiment:
          type: string
          enum: [positive, neutral, negative]
        propertyCount:
          type: integer
        appreciation1y:
          type: number
        appreciation3y:
          type: number
      required:
        - id
        - name
        - city
        - lat
        - lng
        - avgPricePerSqft
        - valueScore
        - futureScore
        - sentiment
        - propertyCount
        - appreciation1y
        - appreciation3y

    NewsArticle:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        source:
          type: string
        area:
          type: string
        city:
          type: string
        sentiment:
          type: string
          enum: [positive, neutral, negative]
        topic:
          type: string
          enum: [infra, policy, jobs, environment, legal, development]
        publishedAt:
          type: string
        summary:
          type: string
      required:
        - id
        - title
        - source
        - area
        - city
        - sentiment
        - topic
        - publishedAt
        - summary
